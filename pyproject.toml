[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane-events"
version = "0.1.0"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.24.0",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.0",
    "pydantic[email]>=2.12.0",
    "sqlalchemy[asyncio]>=2.0.36",
]

[tool.hatch.build.targets.wheel]
packages = ["src/controlplane_events"]

[tool.hatch.build.targets.sdist]
include = ["src/controlplane_events", "LICENSE"]

[dependency-groups]
dev = ["pytest>=8.4.0"]
integration = [
    "controlplane-db",
    "psycopg[binary]>=3.2",
    "pytest-asyncio>=1.2",
    "testcontainers>=4.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
controlplane-db = { git = "https://github.com/hyperme-sh/controlplane-db.git", rev = "58e580d639061c8dcdf9cc65b94b44be17c5b576" }
