[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane-events"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.24.0",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.0",
    "pydantic[email]>=2.12.0",
    "sqlalchemy[asyncio]>=2.0.36",
]

[tool.hatch.build.targets.wheel]
packages = ["src/controlplane_events"]

[tool.hatch.build.targets.sdist]
include = ["src/controlplane_events"]

[dependency-groups]
dev = ["pytest>=8.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
