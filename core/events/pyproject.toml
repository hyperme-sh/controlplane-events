[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane-events"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.12.0",
    "pydantic>=2.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/controlplane_events"]

[tool.hatch.build.targets.sdist]
include = ["src/controlplane_events"]
