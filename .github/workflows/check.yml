name: Component checks
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    # Disposable hosted workers have no route into the shared private runner fleet.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Prepare test evidence directory
        run: echo "TEST_EVIDENCE_DIR=$RUNNER_TEMP/package-test-results" >> "$GITHUB_ENV"
      - name: Prepare release output
        run: echo "RELEASE_ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/release-dist.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.11.26
          python-version: '3.13'
          enable-cache: false
      - run: bash scripts/check.sh
      # GitHub checks action allowlists even when this main-only upload is skipped.
      - name: Retain validated package bytes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-dist
          path: ${{ env.RELEASE_ARTIFACT_DIR }}/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Retain matching package test inventories
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-test-results
          path: ${{ runner.temp }}/package-test-results/*.xml
          if-no-files-found: error
          retention-days: 90
  postgres-integration:
    # Private schema reads belong only to trusted main, never PR code.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    environment: controlplane-libs-read
    steps:
      - name: Prepare test evidence directory
        run: echo "TEST_EVIDENCE_DIR=$RUNNER_TEMP/package-test-results" >> "$GITHUB_ENV"
      - name: Mint repository-scoped dependency token
        id: dependency-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.CONTROLPLANE_LIBS_APP_ID }}
          private-key: ${{ secrets.CONTROLPLANE_LIBS_APP_PRIVATE_KEY }}
          owner: hyperme-sh
          permission-contents: read
          repositories: |
            controlplane-db
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.11.26
          python-version: '3.13'
          enable-cache: false
      - name: Validate event owner against PostgreSQL
        env:
          DEPENDENCY_READ_TOKEN: ${{ steps.dependency-token.outputs.token }}
          TEST_EVIDENCE_DIR: ${{ runner.temp }}/event-test-results
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPENDENCY_READ_TOKEN"
          header=$(printf 'x-access-token:%s' "$DEPENDENCY_READ_TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/hyperme-sh/controlplane-db.git.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $header"
          unset DEPENDENCY_READ_TOKEN
          bash scripts/check-integration.sh
      - name: Retain executed integration identities
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgres-test-results
          path: ${{ runner.temp }}/event-test-results/*.xml
          if-no-files-found: error
          retention-days: 90

  owned-outbox:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
        env:
          POSTGRES_PASSWORD: disposable-outbox-test
        ports: [5432/tcp]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.11.26
          python-version: '3.13'
          enable-cache: false
      - run: uv sync --frozen
      - run: uv sync --frozen --group owner-tests
      - name: Prove owner transaction, claim and isolation behavior
        env:
          OWNED_OUTBOX_DATABASE_URL: postgresql+psycopg://postgres:disposable-outbox-test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres
        run: .venv/bin/python -m pytest -q tests_postgres
