name: Publish the protected Archive runtime to Azure

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact authorized stable release tag
        required: true
        type: string
      stable_run:
        description: Successful stable OCI publisher run for image-only releases
        required: true
        type: string

permissions: {}
concurrency:
  group: archive-azure-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'hyperme-sh/controlplane-events' && github.ref == 'refs/heads/main'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_TAG: ${{ inputs.version }}
      STABLE_RUN: ${{ inputs.stable_run }}
    steps:
      - name: Scope the Azure CLI configuration to this job
        shell: bash
        run: printf 'AZURE_CONFIG_DIR=%s/archive-release-azure\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Bind the stable OCI run to the exact Archive tag and digest
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION_TAG" =~ ^v0\.1\.(0|[1-9][0-9]*)$ && "$STABLE_RUN" =~ ^[1-9][0-9]*$ ]]
          revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/$VERSION_TAG" --jq .sha)
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          attempt=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STABLE_RUN" | jq -er '
            select(.path == ".github/workflows/publish-stable-runtime.yml" and
              .event == "workflow_dispatch" and .head_branch == "main" and .conclusion == "success" and
              .head_repository.full_name == .repository.full_name) | .run_attempt')
          job=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$STABLE_RUN/attempts/$attempt/jobs?per_page=100" |
            jq -ers '.[].jobs[] | select(.name == "publish" and .conclusion == "success") | .id')
          [[ "$job" =~ ^[1-9][0-9]*$ ]]
          digest=$(gh run view "$STABLE_RUN" --repo "$GITHUB_REPOSITORY" --attempt "$attempt" --job "$job" --log |
            sed -nE 's/^.*(\{"version":.*\})\r?$/\1/p' |
            jq -ers --arg version "$VERSION_TAG" --arg revision "$revision" '
              select(length == 1) | .[0] | select(.version == $version and .revision == $revision) | .digest')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Sign in to Azure with the environment's federated identity
        env:
          AZURE_CLIENT_ID: ${{ vars.ARCHIVE_AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.ARCHIVE_AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${AZURE_CLIENT_ID:?}" "${AZURE_TENANT_ID:?}"
          token=$(curl --disable --fail --silent --show-error \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api%3A%2F%2FAzureADTokenExchange" | jq -er '.value | strings | select(length > 0)')
          printf '::add-mask::%s\n' "$token"
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none
          unset token

      - name: Copy the qualified image without rebuilding and protect the tag
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          ACR_TENANT: ${{ vars.ARCHIVE_AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          registry=acrfybercg47
          server="$registry.azurecr.io"
          source="ghcr.io/hyperme-sh/controlplane-events/runtime"
          repository=archive
          target="$server/$repository:$VERSION_TAG"
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/archive-release-docker.XXXXXX")
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          refresh=$(az account get-access-token --resource https://containerregistry.azure.net --query accessToken -o tsv |
            tr -d '\r\n' | curl --disable -fsS --max-time 30 "https://$server/oauth2/exchange" \
              --data 'grant_type=access_token' --data-urlencode "tenant=$ACR_TENANT" \
              --data-urlencode "service=$server" --data-urlencode 'access_token@-' | jq -er .refresh_token)
          printf '%s' "$refresh" |
            docker login "$server" --username 00000000-0000-0000-0000-000000000000 --password-stdin
          metadata_token=$(printf '%s' "$refresh" | curl --disable -fsS --max-time 30 "https://$server/oauth2/token" \
            --data 'grant_type=refresh_token' --data-urlencode "service=$server" \
            --data-urlencode "scope=repository:$repository:metadata_read,metadata_write" \
            --data-urlencode 'refresh_token@-' | jq -er .access_token)
          unset refresh
          metadata() {
            printf 'header = "Authorization: Bearer %s"\n' "$metadata_token" |
              curl --disable -fsS --max-time 30 --config - "$@"
          }
          manifest_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er .digest
          }
          test "$(manifest_digest "$source:$VERSION_TAG")" = "$DIGEST"
          if docker manifest inspect "$target" >/dev/null 2>"$DOCKER_CONFIG/lookup.err"; then
            test "$(manifest_digest "$target")" = "$DIGEST"
          elif [[ "$(cat "$DOCKER_CONFIG/lookup.err")" == "no such manifest: $target" ||
                    "$(cat "$DOCKER_CONFIG/lookup.err")" == "manifest unknown" ]]; then
            docker buildx imagetools create --prefer-index=false --tag "$target" "$source@$DIGEST"
          else
            cat "$DOCKER_CONFIG/lookup.err" >&2
            exit 1
          fi
          test "$(manifest_digest "$target")" = "$DIGEST"
          tag_url="https://$server/acr/v1/$repository/_tags/$VERSION_TAG?api-version=2021-07-01"
          manifest_url="https://$server/acr/v1/$repository/_manifests/$DIGEST?api-version=2021-07-01"
          metadata "$tag_url" --request PATCH --header 'Content-Type: application/json' \
            --data '{"writeEnabled":false,"deleteEnabled":false}' >/dev/null
          metadata "$manifest_url" --request PATCH --header 'Content-Type: application/json' \
            --data '{"deleteEnabled":false}' >/dev/null
          metadata "$tag_url" | jq -e --arg digest "$DIGEST" '.tag | .digest == $digest and
            .changeableAttributes.writeEnabled == false and .changeableAttributes.deleteEnabled == false and
            .changeableAttributes.readEnabled == true' >/dev/null
          metadata "$manifest_url" | jq -e --arg digest "$DIGEST" '.manifest | .digest == $digest and
            .changeableAttributes.deleteEnabled == false and .changeableAttributes.readEnabled == true' >/dev/null
          unset metadata_token
          printf 'Protected %s at %s\n' "$target" "$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
